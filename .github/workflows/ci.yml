name: ORBIS CI Pipeline

on:
  push:
    branches:
      - main
      - 'audit/**'
      - 'release/**'
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-test:
    name: Backend Test Suite (PHP 8.3 & MySQL 8.4)
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: orbis_test
          MYSQL_ALLOW_EMPTY_PASSWORD: 'yes'
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=3

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP runtime
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, pdo, pdo_mysql, bcmath, json, curl, intl
          coverage: none

      - name: Get Composer Cache Directory
        id: composer-cache
        working-directory: apps/api
        run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ hashFiles('apps/api/composer.lock') }}
          restore-keys: ${{ runner.os }}-composer-

      - name: Install PHP dependencies
        working-directory: apps/api
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Run Database Migrations
        working-directory: apps/api
        env:
          APP_ENV: testing
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: orbis_test
          DB_USERNAME: root
          DB_PASSWORD: ''
        run: |
          php artisan migrate --force

      - name: Execute Backend Test Suite
        working-directory: apps/api
        env:
          APP_ENV: testing
          APP_KEY: base64:hhjBm3WGSJbo7ISkHL1nM+Y6s1WvaMipdMBkITACE4k=
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: orbis_test
          DB_USERNAME: root
          DB_PASSWORD: ''
          CACHE_STORE: array
          SESSION_DRIVER: array
          QUEUE_CONNECTION: sync
        run: php artisan test --colors=always

  frontend-build:
    name: Frontend Lint & TypeScript Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js runtime
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: apps/web/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: apps/web
        run: npm ci

      - name: Run Linter
        working-directory: apps/web
        run: npm run lint

      - name: Run TypeScript & Vite Production Build
        working-directory: apps/web
        run: npm run build

  e2e-playwright:
    name: End-to-End Chromium Tests
    needs: [backend-test, frontend-build]
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: orbis_test
          MYSQL_ALLOW_EMPTY_PASSWORD: 'yes'
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=3

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP runtime
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, pdo, pdo_mysql, bcmath, json, curl

      - name: Setup Node.js runtime
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: '**/package-lock.json'

      - name: Install API dependencies & migrate
        working-directory: apps/api
        env:
          APP_ENV: testing
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: orbis_test
          DB_USERNAME: root
          DB_PASSWORD: ''
        run: |
          composer install --no-interaction --prefer-dist
          php artisan migrate --force
          php artisan db:seed --force

      - name: Start Laravel API Server
        working-directory: apps/api
        env:
          APP_ENV: local
          APP_DEBUG: false
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: orbis_test
          DB_USERNAME: root
          DB_PASSWORD: ''
          SESSION_DRIVER: database
        run: |
          php artisan serve --host=127.0.0.1 --port=8000 &
          sleep 2

      - name: Install Frontend Dependencies & Build
        working-directory: apps/web
        run: |
          npm ci
          npm run build

      - name: Start Vite Preview Server
        working-directory: apps/web
        run: |
          npx vite preview --port 5173 --host 127.0.0.1 &
          sleep 3

      - name: Install Root Playwright Dependencies
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Run Playwright E2E Test Suite
        env:
          CI: true
        run: npx playwright test --config=tests/e2e/playwright.config.ts

      - name: Upload E2E Test Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-artifacts
          path: |
            test-results/
            artifacts/testing/
          retention-days: 7
